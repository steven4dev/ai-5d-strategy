<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3;url=AI-5D.html">
    <title>AI-5D 策略分析 | 頁面已搬移</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        .title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #e2e8f0;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.6;
        }
        .new-url {
            background: #0f172a;
            border: 1px solid #6366f1;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.8rem;
            color: #818cf8;
            font-family: monospace;
            word-break: break-all;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        .btn:hover { background: #6366f1; }
        .countdown {
            font-size: 0.72rem;
            color: #475569;
        }
        .countdown span {
            color: #6366f1;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .version-badge {
            display: inline-block;
            background: #312e81;
            color: #a5b4fc;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 999px;
            margin-bottom: 16px;
            border: 1px solid #4338ca;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🚀</div>
        <div class="version-badge">V3.0 雙通道大師版</div>
        <div class="title">AI-5D 策略分析已更新升級</div>
        <div class="subtitle">
            本頁面已整合至新版路徑。<br>
            請更新您的書籤至以下新網址：
        </div>
        <div class="new-url">steven4dev.github.io/ai-5d-strategy/<strong>AI-5D.html</strong></div>
        <a href="AI-5D.html" class="btn">立即前往新版 →</a>
        <div class="countdown">自動跳轉倒數：<span id="sec">3</span> 秒</div>
    </div>

    <script>
        let s = 3;
        const el = document.getElementById('sec');
        const t = setInterval(() => {
            s--;
            el.textContent = s;
            if (s <= 0) {
                clearInterval(t);
                window.location.href = 'AI-5D.html';
            }
        }, 1000);
    </script>
</body>
</html>
